<div class="mnt-page fade-in">

  <!-- ── Unified Header ──────────────────────────────────────────────────── -->
  <div class="mnt-page-head">
    <div>
      <h2>Maintenance &amp; Assets</h2>
      <p>Work orders, recurring preventive schedules, calendar checklists, and equipment registry.</p>
    </div>

    <div class="mnt-head-actions">
      <app-export-menu *ngIf="activeTab !== 'planned'"
                       endpoint="maintenance"
                       filename="Maintenance_Records"
                       [params]="workOrdersExportParams"></app-export-menu>
      <app-export-menu *ngIf="activeTab === 'planned'"
                       endpoint="planned-maintenance"
                       filename="Planned_Maintenance"
                       [params]="plannedExportParams"></app-export-menu>

      <button type="button" class="btn btn-primary" (click)="triggerPrimaryAction()">
        <span class="btn-icon">add</span> {{primaryActionLabel}}
      </button>
    </div>
  </div>

  <!-- ── Unified 3-Tab Switcher ──────────────────────────────────────────── -->
  <div class="mnt-tab-bar" role="tablist" aria-label="Maintenance sections">
    <button type="button"
            role="tab"
            class="mnt-tab-btn"
            [class.active]="activeTab === 'work-orders'"
            [attr.aria-selected]="activeTab === 'work-orders'"
            (click)="selectTab('work-orders')">
      <span class="mat-i">build_circle</span>
      <span>Work Orders</span>
      <span class="mnt-tab-pill" [class.warn]="(maintSummary?.overdue_count ?? 0) > 0">
        {{maintSummary?.total ?? 0}}
      </span>
    </button>

    <button type="button"
            role="tab"
            class="mnt-tab-btn"
            [class.active]="activeTab === 'planned'"
            [attr.aria-selected]="activeTab === 'planned'"
            (click)="selectTab('planned')">
      <span class="mat-i">calendar_month</span>
      <span>Planned Schedule</span>
      <span class="mnt-tab-pill">{{plannedSummary?.active_series ?? 0}}</span>
    </button>

    <button type="button"
            role="tab"
            class="mnt-tab-btn"
            [class.active]="activeTab === 'assets'"
            [attr.aria-selected]="activeTab === 'assets'"
            (click)="selectTab('assets')">
      <span class="mat-i">devices</span>
      <span>Assets Registry</span>
      <span class="mnt-tab-pill">{{assets.length}}</span>
    </button>
  </div>

  <!-- ── Active Tab Panel ────────────────────────────────────────────────── -->
  <app-maintenance-work-orders
    *ngIf="activeTab === 'work-orders'"
    [assets]="assets"
    [uiPrefs]="uiPrefs"
    [refreshTick]="refreshTick"
    [externalStatusFilter]="externalStatusFilter"
    [externalSearch]="externalSearch"
    (logWorkOrderRequested)="openAddWorkOrder()"
    (editWorkOrderRequested)="openEditWorkOrder($event)"
    (detailRequested)="openWorkOrderDetail($event)"
    (statusChangeRequested)="changeWorkOrderStatus($event)"
    (deleteRequested)="deleteWorkOrder($event)"
    (openAssetsTabRequested)="selectTab('assets')"
    (exportParamsChange)="workOrdersExportParams = $event"
    (summaryChange)="maintSummary = $event"
    (mutated)="onMutated()">
  </app-maintenance-work-orders>

  <app-planned-maintenance-dashboard
    *ngIf="activeTab === 'planned'"
    [embedded]="true"
    [refreshTick]="refreshTick"
    (createWorkOrderRequested)="createWorkOrderFromPlanned($event)"
    (summaryChange)="plannedSummary = $event"
    (exportParamsChange)="plannedExportParams = $event">
  </app-planned-maintenance-dashboard>

  <app-maintenance-assets
    *ngIf="activeTab === 'assets'"
    [assetCategories]="assetCategories"
    [refreshTick]="refreshTick"
    (addAssetRequested)="openAddAsset()"
    (editAssetRequested)="openEditAsset($event)"
    (logMaintenanceRequested)="logWorkOrderForAsset($event)"
    (assetsMutated)="onAssetsMutated()">
  </app-maintenance-assets>

</div>

<!-- ── Shared Modals ─────────────────────────────────────────────────────── -->
<app-maintenance-modals
  [assets]="assets"
  [assetCategories]="assetCategories"
  [warehouseItems]="warehouseItems"
  [uiPrefs]="uiPrefs"
  (mutated)="onMutated()"
  (assetsMutated)="onAssetsMutated()">
</app-maintenance-modals>
