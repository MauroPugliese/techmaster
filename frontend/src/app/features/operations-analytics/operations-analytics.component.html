<!-- ==========================================================================
     operations-analytics.component.html — Standalone Operations Deep-Dive Page
     ========================================================================== -->

<div class="an-page fade-in">

  <div class="an-page-head">
    <div>
      <h2>Operations Analytics</h2>
      <p class="an-num">Sortie velocity, mission duration breakdown &amp; peak windows · Scope: {{dateLabel}}</p>
    </div>

    <div class="an-head-actions">
      <div class="an-seg-group" role="group" aria-label="Quick time window">
        <button *ngFor="let opt of periodOptions"
                type="button"
                class="an-seg-btn"
                [class.active]="period === opt.value"
                (click)="selectPeriod(opt.value)">
          {{opt.label}}
        </button>
      </div>

      <a class="btn btn-secondary btn-sm" routerLink="/analytics">
        <span class="btn-icon">insights</span> All Analytics
      </a>

      <app-export-menu endpoint="operations-analytics"
                       filename="Operations_Analytics"
                       label="Export"
                       [params]="exportMenuParams">
      </app-export-menu>

      <button type="button"
              class="btn btn-secondary btn-sm"
              [disabled]="!deepDive?.payload"
              (click)="exportJson()"
              title="Download raw JSON dataset">
        <span class="btn-icon">download</span> JSON
      </button>
    </div>
  </div>

  <app-operations-deep-dive [period]="period" [embedded]="false"></app-operations-deep-dive>

</div>
