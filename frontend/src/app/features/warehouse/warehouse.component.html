<div class="wh-page fade-in">

  <!-- ── Page Header ─────────────────────────────────────────────────────── -->
  <div class="wh-page-head">
    <div>
      <h2>Warehouse &amp; Inventory</h2>
      <p>Stock levels, bin locations, movements ledger, and replenishment priorities.</p>
    </div>

    <div class="wh-head-actions">
      <app-export-menu endpoint="warehouse"
                       filename="Warehouse_Inventory"
                       [params]="exportParams"></app-export-menu>
      <button type="button" class="btn btn-primary" (click)="openAddItem()">
        <span class="btn-icon">add</span> Add Item
      </button>
    </div>
  </div>

  <!-- ── Compact Global KPI Strip (Clickable Quick Filters) ──────────────── -->
  <div class="wh-kpi-grid">
    <button type="button"
            class="kpi-card wh-kpi-card wh-kpi-clickable"
            [class.active]="activeTab === 'inventory' && externalStatusFilter === 'all'"
            style="--kpi-color:#1565C0"
            (click)="filterByKpi('all')">
      <div class="kpi-icon-wrap">inventory_2</div>
      <div class="wh-kpi-body">
        <div class="wh-kpi-value">{{summary?.total_skus ?? 0}}</div>
        <div class="kpi-label">Active SKUs · {{summary?.total_units ?? 0}} units</div>
      </div>
    </button>

    <button type="button"
            class="kpi-card wh-kpi-card wh-kpi-clickable"
            style="--kpi-color:#0288D1"
            (click)="selectTab('inventory')">
      <div class="kpi-icon-wrap">account_balance_wallet</div>
      <div class="wh-kpi-body">
        <div class="wh-kpi-value">{{money(summary?.total_value ?? 0)}}</div>
        <div class="kpi-label">Valuation · Restock {{money(summary?.estimated_restock_cost ?? 0)}}</div>
      </div>
    </button>

    <button type="button"
            class="kpi-card wh-kpi-card wh-kpi-clickable"
            [class.active]="activeTab === 'inventory' && externalStatusFilter === 'healthy'"
            style="--kpi-color:#16A34A"
            (click)="filterByKpi('healthy')">
      <div class="kpi-icon-wrap">check_circle</div>
      <div class="wh-kpi-body">
        <div class="wh-kpi-value">{{summary?.healthy_count ?? 0}}</div>
        <div class="kpi-label">Healthy Stock</div>
      </div>
    </button>

    <button type="button"
            class="kpi-card wh-kpi-card wh-kpi-clickable"
            [class.active]="activeTab === 'inventory' && externalStatusFilter === 'low'"
            style="--kpi-color:#D97706"
            (click)="filterByKpi('low')">
      <div class="kpi-icon-wrap">warning</div>
      <div class="wh-kpi-body">
        <div class="wh-kpi-value">{{summary?.low_count ?? 0}}</div>
        <div class="kpi-label">Low Stock</div>
      </div>
    </button>

    <button type="button"
            class="kpi-card wh-kpi-card wh-kpi-clickable"
            [class.active]="activeTab === 'inventory' && externalStatusFilter === 'out'"
            style="--kpi-color:#DC2626"
            (click)="filterByKpi('out')">
      <div class="kpi-icon-wrap">remove_shopping_cart</div>
      <div class="wh-kpi-body">
        <div class="wh-kpi-value">{{summary?.out_of_stock_count ?? 0}}</div>
        <div class="kpi-label">Out of Stock</div>
      </div>
    </button>
  </div>

  <!-- ── Multi-Tab Switcher ──────────────────────────────────────────────── -->
  <div class="wh-tab-bar" role="tablist" aria-label="Warehouse sections">
    <button type="button"
            role="tab"
            class="wh-tab-btn"
            [class.active]="activeTab === 'inventory'"
            [attr.aria-selected]="activeTab === 'inventory'"
            (click)="selectTab('inventory')">
      <span class="mat-i">inventory_2</span>
      <span>Inventory Catalog</span>
      <span class="wh-tab-pill">{{summary?.total_skus ?? 0}}</span>
    </button>

    <button type="button"
            role="tab"
            class="wh-tab-btn"
            [class.active]="activeTab === 'movements'"
            [attr.aria-selected]="activeTab === 'movements'"
            (click)="selectTab('movements')">
      <span class="mat-i">receipt_long</span>
      <span>Movements Ledger</span>
      <span class="wh-tab-pill">{{summary?.movements_7d ?? 0}} / 7d</span>
    </button>

    <button type="button"
            role="tab"
            class="wh-tab-btn"
            [class.active]="activeTab === 'reorder'"
            [attr.aria-selected]="activeTab === 'reorder'"
            (click)="selectTab('reorder')">
      <span class="mat-i">add_shopping_cart</span>
      <span>Reorder Planner</span>
      <span class="wh-tab-pill" [class.warn]="reorderBadgeCount > 0">{{reorderBadgeCount}}</span>
    </button>
  </div>

  <!-- ── Active Tab Content ──────────────────────────────────────────────── -->
  <app-warehouse-inventory
    *ngIf="activeTab === 'inventory'"
    [categories]="categories"
    [locations]="locations"
    [suppliers]="suppliers"
    [uiPrefs]="uiPrefs"
    [refreshTick]="refreshTick"
    [externalSearch]="externalSearch"
    [externalStatusFilter]="externalStatusFilter"
    [externalLocationFilter]="externalLocationFilter"
    (addItemRequested)="openAddItem()"
    (editItemRequested)="openEditItem($event)"
    (detailRequested)="openDetail($event)"
    (movementRequested)="openMovement($event)"
    (historyRequested)="openHistory($event)"
    (deleteRequested)="deleteItem($event)"
    (statusFilterChanged)="onStatusFilterFromChild($event)"
    (exportParamsChange)="exportParams = $event"
    (mutated)="onMutated()">
  </app-warehouse-inventory>

  <app-warehouse-movements
    *ngIf="activeTab === 'movements'"
    [refreshTick]="refreshTick">
  </app-warehouse-movements>

  <app-warehouse-reorder
    *ngIf="activeTab === 'reorder'"
    [refreshTick]="refreshTick"
    (quickRestockRequested)="openQuickRestock($event)"
    (detailRequested)="openDetail($event)">
  </app-warehouse-reorder>

</div>

<!-- ── Warehouse Modals ──────────────────────────────────────────────────── -->
<app-warehouse-modals
  [categories]="categories"
  [locations]="locations"
  [uiPrefs]="uiPrefs"
  (mutated)="onMutated()">
</app-warehouse-modals>
