<header class="admin-page-head">
  <div>
    <div class="admin-eyebrow">Platform Administration</div>
    <h1>Admin Settings</h1>
    <p class="admin-sub">System health, users, role permissions, catalogs, section access, and audit logs</p>
  </div>
</header>

<div class="admin-layout fade-in">

  <!-- ── Left Grouped Navigation Sidebar ─────────────────────────────────── -->
  <aside class="card admin-sidebar">
    <div class="admin-nav-group" *ngFor="let group of navGroups">
      <div class="admin-nav-heading">{{group.title}}</div>

      <button type="button"
              *ngFor="let item of group.items"
              class="admin-nav-btn"
              [class.active]="activeTab === item.id"
              (click)="setTab(item.id)">
        <span class="mat-i admin-nav-ic">{{item.icon}}</span>
        <span class="admin-nav-lbl">{{item.label}}</span>
        <span class="admin-nav-badge" *ngIf="getItemCount(item.countKey) !== null">
          {{getItemCount(item.countKey)}}
        </span>
      </button>
    </div>
  </aside>

  <!-- ── Active Admin Workspace ──────────────────────────────────────────── -->
  <section class="admin-main">
    <app-admin-overview
      *ngIf="activeTab === 'overview'"
      [systemInfo]="systemInfo"
      [loading]="overviewLoading"
      (refreshRequested)="loadSystemInfo()"
      (navigateTab)="setTab($event)"
      (openRoleUsers)="onOpenUsersByRoleName($event)">
    </app-admin-overview>

    <app-admin-audit-logs
      *ngIf="activeTab === 'audit-logs'">
    </app-admin-audit-logs>

    <app-admin-users
      *ngIf="activeTab === 'users'"
      [roles]="roles"
      [initialRoleFilterId]="usersInitialRoleFilterId"
      (usersChanged)="loadSystemInfo(); loadRoles()"
      (manageSectionAccess)="onOpenUserSectionAccess($event)">
    </app-admin-users>

    <app-admin-roles
      *ngIf="activeTab === 'roles'"
      (viewRoleUsers)="onOpenUsersByRoleId($event)"
      (configureSectionAccess)="onOpenRoleSectionAccess($event)">
    </app-admin-roles>

    <app-section-access-manager
      *ngIf="activeTab === 'section-access'"
      [roles]="roles"
      [initialTarget]="sectionAccessTarget"
      [initialRole]="sectionAccessRole"
      [initialUserId]="sectionAccessUserId">
    </app-section-access-manager>

    <app-admin-catalogs
      *ngIf="activeCatalogTab"
      [activeTab]="activeCatalogTab"
      [tabLabel]="activeTabLabel"
      (catalogChanged)="loadSystemInfo()">
    </app-admin-catalogs>

    <app-admin-customization
      *ngIf="activeTab === 'customization'"
      [roles]="roles">
    </app-admin-customization>
  </section>

</div>
