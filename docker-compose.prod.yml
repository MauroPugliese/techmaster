# =============================================================================
# docker-compose.prod.yml
# Use explicitly:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Disables the automatic override file and adds production hardening.
# =============================================================================

version: "3.9"

services:

  db:
    # Read replicas or managed RDS? Replace with an external network and
    # remove the db service entirely for cloud deployments.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus:   "0.75"

  backend:
    # Note: container_name + host port bindings in docker-compose.yml require single replica
    # in standard Docker Compose. Remove container_name & fixed ports when deploying on Swarm/K8s.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus:   "0.75"
      restart_policy:
        condition: on-failure
        delay:     5s
        max_attempts: 3
    # Read-only filesystem in production (logs go to Docker logging driver)
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs

  frontend:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
          cpus:   "0.25"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
